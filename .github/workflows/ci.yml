name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: go-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: fiscal
          POSTGRES_DB: fiscal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscal -d fiscal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FISCAL_TEST_DATABASE_URL: postgres://fiscal:fiscal@localhost:5432/fiscal?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Compliance catalog metadata validation
        run: |
          python3 -m venv compliance/scripts/.venv
          compliance/scripts/.venv/bin/pip install -q -r compliance/scripts/requirements.txt
          compliance/scripts/.venv/bin/python compliance/scripts/verify_catalog.py
          bash compliance/scripts/verify_no_local_deps.sh

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -P SCRIPTDIR -e SC1091 \
            scripts/deploy/lib/allowlist.sh \
            scripts/deploy/lib/predeploy_pg.sh \
            scripts/deploy/*.sh \
            tests/deploy/run-tests.sh \
            tests/deploy/run-predeploy-pg16.sh
          shellcheck -e SC2317,SC2329 \
            scripts/integration/pos-sandbox-kit.sh \
            tests/integration/run-pos-kit-tests.sh
          shellcheck -e SC2016 compliance/scripts/verify_no_local_deps.sh

      - name: Deploy D1 script tests
        run: |
          bash -n scripts/deploy/*.sh scripts/deploy/lib/*.sh tests/deploy/run-tests.sh \
            tests/deploy/run-predeploy-pg16.sh tests/deploy/mocks/bin/*
          bash -n scripts/integration/pos-sandbox-kit.sh tests/integration/run-pos-kit-tests.sh
          bash scripts/deploy/check-antipatterns.sh
          bash tests/deploy/run-tests.sh
          # Must run and fail the job on whitespace/conflict markers (no masking || fallback).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "HEAD~1...HEAD"
          fi

      - name: POS sandbox kit tests (S4 mocks)
        run: bash tests/integration/run-pos-kit-tests.sh

      - name: OpenAPI lint
        run: |
          npx --yes @redocly/cli@1.34.3 lint specs/openapi/openapi.yaml

      - name: Migration parity and immutability
        if: github.event_name == 'pull_request'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-migrations.sh

      - name: Migration parity (push to main)
        if: github.event_name == 'push'
        run: bash scripts/check-migrations.sh

      - name: Vet
        run: go vet ./...

      - name: Test race
        run: go test -race ./...

      - name: Install tools
        working-directory: tools
        run: |
          go mod download
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/google/go-licenses@v1.6.0

      - name: govulncheck
        run: govulncheck ./...

      - name: License check
        run: |
          ALLOWED="$(tr '\n' ',' < licenses/allowlist.txt | sed 's/,$//')"
          go-licenses check ./cmd/fiscal-api ./cmd/fiscal-migrate ./cmd/fiscal-admin \
            ./cmd/fiscal-sandbox-measure \
            --ignore github.com/storesace-cv/bwb-modulo-fiscal \
            --ignore modernc.org/mathutil \
            --allowed_licenses="$ALLOWED"

  predeploy-pg16:
    name: predeploy-pg16-real
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16 openssl
          # Free :5432 for the ephemeral SSL instance (closed parser requires port 5432).
          sudo systemctl stop postgresql || true
          sudo systemctl stop postgresql@16-main || true
          for s in /etc/init.d/postgresql*; do
            if [[ -x "$s" ]]; then sudo "$s" stop || true; fi
          done

      - name: Real pre-deploy pg_dump gate
        run: bash tests/deploy/run-predeploy-pg16.sh
