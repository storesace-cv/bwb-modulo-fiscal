openapi: 3.1.0
info:
  title: BWB Fiscal Admin API
  version: 0.1.4-draft
  description: >
    Contrato administrativo separado da API POS pública. Prefixo /admin/v1.
    Autenticação OIDC/JWT com RBAC (owner|admin|operator|auditor), distinta do
    Bearer credential_store POS. Sem IdP real neste draft: implementação usa
    Authenticator injectável fail-closed (testes/dev explícito). Segredos NÃO
    são devolvidos — zona SecAdm owner-only write-only (DEC-BO-001/002).
    0.1.1: PATCH scope-bindings (séries/timezone/ambiente metadados; RM-BO-002).
    0.1.2: ops visibility + audit list + secret-ref metadata sanitizado (RM-BO-003).
    0.1.3: matriz RBAC documentada; MFA adiado até IdP; sem ACL secret.reveal (RM-BO-004).
    0.1.4: SecAdm HTTP Put/Rotate/Revoke owner-only; respostas só metadados (RM-SECADM-003).
    Não pronto para produção. ≠ credenciais AGT.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080/admin/v1
    description: Desenvolvimento local (Authenticator injectável; não é IdP)
security:
  - adminBearer: []
paths:
  /taxpayers:
    post:
      operationId: createTaxpayer
      summary: Cria contribuinte (cadastro não secreto)
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxpayerRequest"
      responses:
        "201":
          description: Contribuinte criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxpayer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /taxpayers/{taxpayer_id}:
    get:
      operationId: getTaxpayer
      summary: Obtém contribuinte por id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/TaxpayerId"
      responses:
        "200":
          description: Contribuinte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxpayer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /establishments:
    post:
      operationId: createEstablishment
      summary: Cria estabelecimento sob um contribuinte
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstablishmentRequest"
      responses:
        "201":
          description: Estabelecimento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}:
    get:
      operationId: getEstablishment
      summary: Obtém estabelecimento por id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      responses:
        "200":
          description: Estabelecimento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /scope-bindings:
    post:
      operationId: createScopeBinding
      summary: Cria binding de scope (metadados não secretos)
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeBindingRequest"
      responses:
        "201":
          description: Binding criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /scope-bindings/{scope_id}:
    get:
      operationId: getScopeBinding
      summary: Obtém scope binding por scope_id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: Binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScopeBindingConfig
      summary: Actualiza séries/timezone/ambiente/status (metadados não secretos)
      description: >
        Não altera taxpayer_id nem establishment_id. Ambiente é metadado
        (homologation|production|development); não lê nem escreve segredos.
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScopeConfigRequest"
      responses:
        "200":
          description: Binding actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Lista eventos de auditoria admin (append-only, sem segredos)
      tags: [Ops]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ops/submissions:
    get:
      operationId: listOpsSubmissions
      summary: Visibilidade ops de submissões (estados; sem corpos secretos)
      tags: [Ops]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Resumos sanitizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /secret-refs/metadata:
    get:
      operationId: getSecretRefMetadata
      summary: Metadados sanitizados de uma ref (nunca o segredo)
      description: >
        Plano A — fingerprint/status/ambiente apenas. Sem plaintext. Put/Rotate/Revoke
        permanecem na zona SecAdm owner-only.
      tags: [Ops]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
        - name: environment
          in: query
          required: true
          schema:
            type: string
            enum: [homologation, production]
        - name: subject_id
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metadados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs:
    put:
      operationId: secadmPutSecretRef
      summary: Provisiona segredo (write-only; owner only)
      description: >
        Aceita plaintext no pedido; resposta contém apenas metadados sanitizados.
        Nunca devolve o segredo. Requer role owner + subject = FISCAL_ADMIN_OWNER_SUBJECT.
        ≠ credenciais AGT reais.
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmWriteSecretRequest"
      responses:
        "200":
          description: Metadados após put
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs/rotate:
    post:
      operationId: secadmRotateSecretRef
      summary: Roda segredo (write-only; owner only)
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmWriteSecretRequest"
      responses:
        "200":
          description: Metadados após rotate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs/revoke:
    post:
      operationId: secadmRevokeSecretRef
      summary: Revoga segredo (owner only; sem revelar valor)
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmRevokeSecretRequest"
      responses:
        "200":
          description: Metadados após revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC/JWT de operador (RBAC: owner|admin|operator|auditor). Distinto do
        bearerAuth POS. Só owner acede SecAdm. Neste draft, o runtime de testes
        injecta claims via Authenticator; sem IdP real.
  parameters:
    TaxpayerId:
      name: taxpayer_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EstablishmentId:
      name: establishment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    CreateTaxpayerRequest:
      type: object
      additionalProperties: false
      required: [nif, legal_name]
      properties:
        nif:
          type: string
          minLength: 1
        legal_name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, inactive]
          default: active
    Taxpayer:
      type: object
      additionalProperties: false
      required: [taxpayer_id, nif, legal_name, status, created_at]
      properties:
        taxpayer_id:
          type: string
        nif:
          type: string
        legal_name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
    CreateEstablishmentRequest:
      type: object
      additionalProperties: false
      required: [taxpayer_id, code, name]
      properties:
        taxpayer_id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
          default: active
    Establishment:
      type: object
      additionalProperties: false
      required: [establishment_id, taxpayer_id, code, name, status, created_at]
      properties:
        establishment_id:
          type: string
        taxpayer_id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
    CreateScopeBindingRequest:
      type: object
      additionalProperties: false
      required:
        - scope_id
        - taxpayer_id
        - establishment_id
        - environment
        - iana_timezone
        - series_effective_code
      properties:
        scope_id:
          type: string
        taxpayer_id:
          type: string
        establishment_id:
          type: string
        environment:
          type: string
          enum: [homologation, production, development]
        iana_timezone:
          type: string
          example: Africa/Luanda
        series_effective_code:
          type: string
        status:
          type: string
          enum: [active, inactive]
          default: active
    UpdateScopeConfigRequest:
      type: object
      additionalProperties: false
      required: [environment, iana_timezone, series_effective_code, status]
      properties:
        environment:
          type: string
          enum: [homologation, production, development]
          description: Metadado HML/PRD/dev — sem segredos
        iana_timezone:
          type: string
        series_effective_code:
          type: string
        status:
          type: string
          enum: [active, inactive]
    ScopeBinding:
      type: object
      additionalProperties: false
      required:
        - scope_id
        - taxpayer_id
        - establishment_id
        - environment
        - iana_timezone
        - series_effective_code
        - status
        - created_at
      properties:
        scope_id:
          type: string
        taxpayer_id:
          type: string
        establishment_id:
          type: string
        environment:
          type: string
          enum: [homologation, production, development]
        iana_timezone:
          type: string
        series_effective_code:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, actor_subject, actor_roles, action, resource_type, resource_id, result]
      properties:
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor_subject:
          type: string
        actor_roles:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        result:
          type: string
        request_id:
          type: string
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    SubmissionSummary:
      type: object
      additionalProperties: false
      required: [submission_id, document_id, outbox_state, outbox_updated_at]
      properties:
        submission_id:
          type: string
        document_id:
          type: string
        outbox_state:
          type: string
        ledger_status:
          type: string
        latest_outcome:
          type: string
        outbox_updated_at:
          type: string
          format: date-time
    SubmissionSummaryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionSummary"
    SecAdmWriteSecretRequest:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name, plaintext]
      properties:
        kind:
          type: string
        environment:
          type: string
          enum: [homologation, production]
        subject_id:
          type: string
        name:
          type: string
        plaintext:
          type: string
          minLength: 1
          description: Valor write-only — nunca devolvido na resposta
        expires_at:
          type: string
          format: date-time
    SecAdmRevokeSecretRequest:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name]
      properties:
        kind:
          type: string
        environment:
          type: string
          enum: [homologation, production]
        subject_id:
          type: string
        name:
          type: string
    SecretRefMetadata:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name, status, version]
      properties:
        kind:
          type: string
        environment:
          type: string
        subject_id:
          type: string
        name:
          type: string
        status:
          type: string
        fingerprint:
          type: string
        version:
          type: integer
        expires_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Autenticado sem papel suficiente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de unicidade
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Validação falhou
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
