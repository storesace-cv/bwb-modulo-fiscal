    SecAdmWriteSecretRequest:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name, plaintext]
      properties:
        kind:
          type: string
        environment:
          type: string
          enum: [homologation, production]
        subject_id:
          type: string
        name:
          type: string
        plaintext:
          type: string
          minLength: 1
          description: Valor write-only — nunca devolvido na resposta
        expires_at:
          type: string
          format: date-time
    SecAdmRevokeSecretRequest:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name]
      properties:
        kind:
          type: string
        environment:
          type: string
          enum: [homologation, production]
        subject_id:
          type: string
        name:
          type: string
    SecAdmMaterialMetadata:
      allOf:
        - $ref: "#/components/schemas/SecretRefMetadata"
        - type: object
          additionalProperties: false
          required: [encoding, format_note]
          properties:
            encoding:
              type: string
              enum: [credential, pem, pkcs12]
            format_note:
              type: string
              description: Nota sanitizada (ex. pem_private_key); nunca plaintext
    SecAdmOfflineValidateRequest:
      type: object
      additionalProperties: false
      required: [key_kind, key_environment, key_subject_id, key_name, cert_kind, cert_environment, cert_subject_id, cert_name]
      properties:
        key_kind: { type: string }
        key_environment: { type: string, enum: [homologation, production] }
        key_subject_id: { type: string }
        key_name: { type: string }
        cert_kind: { type: string }
        cert_environment: { type: string, enum: [homologation, production] }
        cert_subject_id: { type: string }
        cert_name: { type: string }
        profile_id: { type: string }
        intermediates_pem:
          type: string
          description: Cadeia pública opcional; rejeita PRIVATE KEY
    SecAdmOfflineValidateResponse:
      type: object
      additionalProperties: false
      required: [ok, pair_match, chain_ok, within_validity, purpose_ok, fingerprint_sha256, external_verified]
      properties:
        ok: { type: boolean }
        pair_match: { type: boolean }
        chain_ok: { type: boolean }
        within_validity: { type: boolean }
        purpose_ok: { type: boolean }
        purpose_note: { type: string }
        fingerprint_sha256: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_bits: { type: integer }
        algorithm_note: { type: string }
        issues:
          type: array
          items: { type: string }
        offline_validated_set: { type: boolean }
        external_verified:
          type: boolean
          description: Sempre false nesta superfície
    SecretRefMetadata:
      type: object
      additionalProperties: false
      required: [kind, environment, subject_id, name, status, version]
      properties:
        kind:
          type: string
        environment:
          type: string
        subject_id:
          type: string
        name:
          type: string
        status:
          type: string
        fingerprint:
          type: string
        version:
          type: integer
        expires_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
    AuthorityProfile:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - environment
        - display_name
        - status
        - allowed_operations
        - pending_external
        - config_ready
        - secrets_ready
        - offline_validated
        - external_verified
        - created_at
        - updated_at
      properties:
        profile_id:
          type: string
        environment:
          type: string
          enum: [homologation, production]
        taxpayer_id:
          type: string
        scope_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [draft, validated, active, revoked]
          description: >
            active exige config_ready+secrets_ready+offline_validated (fail-closed, RM-AGTPREP-009).
            external_verified nunca é aceite como true (≠ AGT).
        allowed_operations:
          type: array
          items:
            type: string
            enum: [registarFactura, solicitarSerie, listarSeries, obterEstado, listarFacturas]
          description: Só chaves catalogadas FE HML (pending_validation); não inventar paths
        pending_external:
          type: object
          additionalProperties:
            type: string
          description: Campos ainda desconhecidos / conflitos (ex. C-FE-001); nunca segredos
        producer_credential_ref:
          type: string
          description: Nome lógico de ref SecretStore (não o segredo)
        producer_key_ref:
          type: string
        certificate_ref:
          type: string
        algorithm_declared:
          type: string
          enum: [RS256, pending_external]
        key_id_sanitized:
          type: string
        fingerprint_sanitized:
          type: string
        expires_at:
          type: string
          format: date-time
        config_ready:
          type: boolean
        secrets_ready:
          type: boolean
        offline_validated:
          type: boolean
        external_verified:
          type: boolean
          description: Sempre false até probe AGT real autorizada
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAuthorityProfileRequest:
      type: object
      additionalProperties: false
      required: [environment, display_name]
      properties:
        environment:
          type: string
          enum: [homologation, production]
        taxpayer_id:
          type: string
        scope_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [draft, validated, active, revoked]
          description: >
            active sem readiness local completa é rejeitado (422 / ADMIN_VALIDATION).
            external_verified permanece false.
        allowed_operations:
          type: array
          items:
            type: string
        pending_external:
          type: object
          additionalProperties:
            type: string
        producer_credential_ref:
          type: string
        producer_key_ref:
          type: string
        certificate_ref:
          type: string
        algorithm_declared:
          type: string
        key_id_sanitized:
          type: string
        fingerprint_sanitized:
          type: string
        expires_at:
          type: string
          format: date-time
    UpdateAuthorityProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
        status:
          type: string
          enum: [draft, validated, active, revoked]
          description: >
            Transição para active exige as três flags locais true; limpar flags com status=active falha.
        allowed_operations:
          type: array
          items:
            type: string
        pending_external:
          type: object
          additionalProperties:
            type: string
        producer_credential_ref:
          type: string
        producer_key_ref:
          type: string
        certificate_ref:
          type: string
        algorithm_declared:
          type: string
        key_id_sanitized:
          type: string
        fingerprint_sanitized:
          type: string
        expires_at:
          type: string
          format: date-time
        config_ready:
          type: boolean
        secrets_ready:
          type: boolean
        offline_validated:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        request_id:
          type: string
  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Autenticado sem papel suficiente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de unicidade
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Validação falhou
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
