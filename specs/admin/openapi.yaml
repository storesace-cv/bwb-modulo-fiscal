        taxpayer_id:
          type: string
        establishment_id:
          type: string
        environment:
          type: string
          enum: [homologation, production, development]
        iana_timezone:
          type: string
        series_effective_code:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
    ScopeBindingList:
      type: object
