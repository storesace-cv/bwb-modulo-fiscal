          type: string
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    SubmissionSummary:
      type: object
      additionalProperties: false
      required:
        - submission_id
        - document_id
        - outbox_state
        - queue_status
        - attempts
        - outbox_updated_at
      properties:
        submission_id:
          type: string
        document_id:
          type: string
        outbox_state:
          type: string
          enum: [pending, in_flight, succeeded, dead]
        ops_disposition:
          type: string
          enum: [cancelled, manual_review]
        queue_status:
          type: string
          enum: [pending, processing, accepted, rejected, retry, manual_review, cancelled]
        ledger_status:
          type: string
        latest_outcome:
          type: string
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        authority_request_id:
          type: string
          description: Correlação sanitizada; nunca segredo/JWS/NIF.
        sanitized_error:
          type: string
          description: Allowlist (authority_rejected|authority_outcome_unknown|retried_unavailable|outbox_dead|ops_cancelled|ops_manual_review).
        outbox_updated_at:
          type: string
          format: date-time
    OpsQueueActionRequest:
