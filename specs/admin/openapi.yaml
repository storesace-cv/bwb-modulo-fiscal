openapi: 3.1.0
info:
  title: BWB Fiscal Admin API
  version: 0.1.25-draft
  description: >
    Contrato administrativo separado da API POS pública. Prefixo /admin/v1.
    Autenticação OIDC/JWT com RBAC (owner|admin|operator|auditor), distinta do
    Bearer credential_store POS. Runtime: fail_closed | injected (dev) |
    oidc_jwt (JWKS https, iss/aud exactos, role map; DEC-BO-003 / RM-BO-006).
    Segredos NÃO são devolvidos — zona SecAdm owner-only write-only (DEC-BO-001/002).
    0.1.1: PATCH scope-bindings (séries/timezone/ambiente metadados; RM-BO-002).
    0.1.2: ops visibility + audit list + secret-ref metadata sanitizado (RM-BO-003).
    0.1.3: matriz RBAC documentada; MFA adiado até IdP; sem ACL secret.reveal (RM-BO-004).
    0.1.4: SecAdm HTTP Put/Rotate/Revoke owner-only; respostas só metadados (RM-SECADM-003).
    0.1.5: listagens cadastro + PATCH status taxpayer/establishment (RM-BO-005).
    0.1.6: fundação OIDC/JWT provider-neutral documentada (RM-BO-006).
    0.1.7: observabilidade admin — health/ready/metrics + request_id (RM-BO-007).
    0.1.8: AuthorityProfile metadados HML/PRD (RM-AGTPREP-002 / DEC-BO-004); sem segredos; external_verified=false.
    0.1.9: UI SSR owner-only /admin/ui/authority-profiles (RM-AGTPREP-003); contrato HTTP inalterado; sem plaintext.
    0.1.10: SecAdm material multipart PEM/PKCS#12/credencial (RM-AGTPREP-004); password efémera; limites; ≠ AGT.
    0.1.11: Validação offline par chave-cert (RM-AGTPREP-005); ≠ external_verified / AGT.
    0.1.12: Probe config simulador + prod fail-closed (RM-AGTPREP-006); simulator≠AGT.
    0.1.13: Checklist readiness 4 flags + métricas authority (RM-AGTPREP-007).
    0.1.14: UI SSR readiness checklist (RM-BO-011); contrato HTTP inalterado.
    0.1.15: UI SSR wizard owner-only /admin/ui/authority-profiles/wizard (RM-AGTPREP-008); draft only; contrato HTTP inalterado.
    0.1.16: Gate activação AuthorityProfile fail-closed (RM-AGTPREP-009); active exige config+secrets+offline; external_verified=false.
    0.1.17: Lifecycle material AuthorityProfile (RM-AGTPREP-010); rotate invalida offline_validated; sem plaintext.
    0.1.18: Histórico append-only AuthorityProfile (RM-AGTPREP-011); audit list por perfil; sem plaintext.
    0.1.19: Alertas sanitizados readiness (RM-AGTPREP-012); expiry/refs/flags; ≠ external_verified.
    0.1.20: Testes de segurança superfície autoridade documentados (RM-AGTPREP-013); contrato HTTP inalterado.
    0.1.21: Adesão FE enum por contribuinte+ambiente (DEC-PROD-004 / RM-BO-012); ≠ booleano; NIF nunca em audit resource_id.
    0.1.22: Política calculada documentos disponíveis (RM-BO-013 / DEC-PROD-001…006); 5 grupos; sem inventar códigos.
    0.1.23: Séries por estabelecimento/ambiente/tipo (RM-BO-014); draft/active/closed; sem reutilizar/retroceder.
    0.1.24: Painel filas/submissões enriquecido (RM-BO-015); queue_status/attempts/next_attempt/request_id/erro sanitizado; sem payload/JWS.
    0.1.25: Acções ops retry/cancel/manual_review (RM-BO-016); ops.write; Idempotency-Key; concurrency; simulator≠production.
    Não pronto para produção. ≠ credenciais AGT. ≠ fornecedor IdP fixo.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080/admin/v1
    description: Desenvolvimento local (fail_closed / injected / oidc_jwt)
security:
  - adminBearer: []
paths:
  /health:
    get:
      operationId: adminHealth
      summary: Liveness do componente admin (sem auth)
      tags: [Observabilidade]
      security: []
      responses:
        "200":
          description: Processo a ouvir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
  /ready:
    get:
      operationId: adminReady
      summary: Readiness sanitizada (DB ping, auth mode, SecAdm gate presente/ausente)
      tags: [Observabilidade]
      security: []
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReady"
        "503":
          description: Não pronto (checks falharam; sem DSN/segredos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReady"
  /ops/metrics:
    get:
      operationId: adminOpsMetrics
      summary: Contadores de baixa cardinalidade (ops.read)
      tags: [Observabilidade]
      responses:
        "200":
          description: Snapshot de métricas sanitizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /taxpayers:
    get:
      operationId: listTaxpayers
      summary: Lista contribuintes (metadados não secretos)
      tags: [Cadastros]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxpayerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTaxpayer
      summary: Cria contribuinte (cadastro não secreto)
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxpayerRequest"
      responses:
        "201":
          description: Contribuinte criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxpayer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /taxpayers/{taxpayer_id}:
    get:
      operationId: getTaxpayer
      summary: Obtém contribuinte por id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/TaxpayerId"
      responses:
        "200":
          description: Contribuinte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxpayer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTaxpayerStatus
      summary: Actualiza status active/inactive
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/TaxpayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Contribuinte actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxpayer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /taxpayers/{taxpayer_id}/fe-enrollments:
    put:
      operationId: upsertTaxpayerFEEnrollment
      summary: Upsert adesão FE (enum DEC-PROD-004) por ambiente
      description: >
        Estado canónico not_enrolled|pending|active|suspended — nunca booleano.
        "aderiu facturação electrónica" ≡ status=active nesse ambiente.
        Audit resource_id = taxpayer_id (nunca NIF).
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/TaxpayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFEEnrollmentRequest"
      responses:
        "200":
          description: Adesão FE actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FEEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments:
    get:
      operationId: listEstablishments
      summary: Lista estabelecimentos
      tags: [Cadastros]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: taxpayer_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createEstablishment
      summary: Cria estabelecimento sob um contribuinte
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstablishmentRequest"
      responses:
        "201":
          description: Estabelecimento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}:
    get:
      operationId: getEstablishment
      summary: Obtém estabelecimento por id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      responses:
        "200":
          description: Estabelecimento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEstablishmentStatus
      summary: Actualiza status active/inactive
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Estabelecimento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}/document-availability:
    get:
      operationId: getDocumentAvailability
      summary: Política calculada de documentos disponíveis (5 grupos)
      description: >
        DEC-PROD-001…006 / RM-BO-013. Só tipos do seed; activos; sem FE activa só SAF-T-compatíveis;
        com adesão FE active só matriz FE (L4 no seed); pending_validation/conflito indisponíveis.
        Não inventa códigos FE-RNG. fe_aderiu é derivado (status==active), não modelo booleano.
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
        - name: environment
          in: query
          schema:
            type: string
            enum: [homologation, production, development]
            default: homologation
      responses:
        "200":
          description: Relatório de disponibilidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAvailabilityReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}/document-groups:
    put:
      operationId: upsertDocumentGroupConfig
      summary: Activa/desactiva um dos 5 grupos (DEC-PROD-003)
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDocumentGroupRequest"
      responses:
        "200":
          description: Grupo actualizado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}/document-types:
    put:
      operationId: upsertDocumentTypeConfig
      summary: Override de activação de tipo canónico do catálogo
      description: codigo_canonico deve existir no seed; proibido inventar códigos.
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDocumentTypeRequest"
      responses:
        "200":
          description: Tipo actualizado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /establishments/{establishment_id}/series:
    get:
      operationId: listEstablishmentSeries
      summary: Lista séries do estabelecimento (metadados)
      description: >
        RM-BO-014. Metadados locais draft/active/closed — ≠ autoridade de numeração fiscal;
        ≠ solicitarSerie AGT. Código único por loja+ambiente.
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
        - name: environment
          in: query
          schema:
            type: string
            enum: [homologation, production, development]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Lista de séries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createEstablishmentSeries
      summary: Cria série em draft
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/EstablishmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesRequest"
      responses:
        "201":
          description: Série criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /series/{series_id}:
    get:
      operationId: getSeries
      summary: Obtém série por id
      tags: [Cadastros]
      parameters:
        - name: series_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Série
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{series_id}/transition:
    post:
      operationId: transitionSeries
      summary: Transição draft→active ou active/draft→closed (optimistic concurrency)
      description: Proibido retroceder; closed é terminal; expected_version obrigatório.
      tags: [Cadastros]
      parameters:
        - name: series_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionSeriesRequest"
      responses:
        "200":
          description: Série actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /scope-bindings:
    get:
      operationId: listScopeBindings
      summary: Lista scope bindings (metadados não secretos)
      tags: [Cadastros]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createScopeBinding
      summary: Cria binding de scope (metadados não secretos)
      tags: [Cadastros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeBindingRequest"
      responses:
        "201":
          description: Binding criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /scope-bindings/{scope_id}:
    get:
      operationId: getScopeBinding
      summary: Obtém scope binding por scope_id
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: Binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScopeBindingConfig
      summary: Actualiza séries/timezone/ambiente/status (metadados não secretos)
      description: >
        Não altera taxpayer_id nem establishment_id. Ambiente é metadado
        (homologation|production|development); não lê nem escreve segredos.
      tags: [Cadastros]
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScopeConfigRequest"
      responses:
        "200":
          description: Binding actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /authority/probe-config:
    post:
      operationId: probeAuthorityConfig
      summary: Teste de ligação/configuração via simulador (owner)
      description: >
        RM-AGTPREP-006. Só com FISCAL_AUTHORITY=simulator. Produção+simulator fail-closed.
        external_verified permanece false. simulator ≠ AGT HML/PRD.
      tags: [Autoridade]
      responses:
        "200":
          description: Resultado sanitizado do probe
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, mode, external_verified]
                properties:
                  ok: { type: boolean }
                  mode: { type: string }
                  simulator_reachable: { type: boolean }
                  outcome: { type: string }
                  authority_request_id: { type: string }
                  external_verified: { type: boolean }
                  notes:
                    type: array
                    items: { type: string }
                  probed_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /authority-profiles:
    get:
      operationId: listAuthorityProfiles
      summary: Lista perfis de autoridade (metadados; sem segredos)
      description: >
        DEC-BO-004 / RM-AGTPREP-002. ops.read. Nunca devolve PEM, passwords ou tokens.
        external_verified é sempre false até probe AGT real.
      tags: [Autoridade]
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorityProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAuthorityProfile
      summary: Cria perfil de autoridade (owner-only; sem segredos)
      tags: [Autoridade]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorityProfileRequest"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /authority-profiles/{profile_id}:
    get:
      operationId: getAuthorityProfile
      summary: Obtém perfil de autoridade
      tags: [Autoridade]
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAuthorityProfile
      summary: Actualiza metadados/readiness do perfil (owner-only)
      description: external_verified não pode ser true por este endpoint.
      tags: [Autoridade]
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorityProfileRequest"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /authority-profiles/{profile_id}/material-lifecycle:
    get:
      operationId: getAuthorityProfileMaterialLifecycle
      summary: Lifecycle sanitizado das refs SecretStore do perfil
      description: >
        RM-AGTPREP-010. Owner/secadm.write. Devolve status/version/fingerprint/expires
        das refs lógicas (credential/key/cert). Sem plaintext. external_verified=false.
        Após rotate/revoke com authority_profile_id, offline_validated é invalidado.
      tags: [Autoridade]
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lifecycle sanitizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profile_id, environment, status, offline_validated, secrets_ready, external_verified, refs, note]
                properties:
                  profile_id: { type: string }
                  environment: { type: string }
                  status: { type: string }
                  offline_validated: { type: boolean }
                  secrets_ready: { type: boolean }
                  external_verified: { type: boolean, const: false }
                  note: { type: string }
                  refs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [role, ref_name, kind, environment, subject_id, status, version]
                      properties:
                        role: { type: string, enum: [producer_credential, producer_key, certificate] }
                        ref_name: { type: string }
                        kind: { type: string }
                        environment: { type: string }
                        subject_id: { type: string }
                        status: { type: string }
                        version: { type: integer }
                        fingerprint: { type: string }
                        expires_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: SecAdm indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /authority-profiles/{profile_id}/history:
    get:
      operationId: getAuthorityProfileHistory
      summary: Histórico append-only de auditoria do perfil
      description: >
        RM-AGTPREP-011. audit.read. Eventos admin_audit_events filtrados por
        resource_type=authority_profile. Sem plaintext; append-only; external_verified=false.
      tags: [Autoridade]
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Lista append-only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profile_id, append_only, external_verified, items, note]
                properties:
                  profile_id: { type: string }
                  append_only: { type: boolean, const: true }
                  external_verified: { type: boolean, const: false }
                  note: { type: string }
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /authority-profiles/{profile_id}/readiness:
    get:
      operationId: getAuthorityProfileReadiness
      summary: Checklist readiness (4 flags + alertas; external_verified=false)
      description: >
        RM-AGTPREP-007/012. ops.read. Distingue config_ready, secrets_ready, offline_validated
        e external_verified (sempre false). Alertas sanitizados (expiração/refs/flags).
        Auditoria append-only; métricas route=authority sem labels sensíveis.
      tags: [Autoridade]
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checklist sanitizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profile_id, config_ready, secrets_ready, offline_validated, external_verified, checklist_complete, alerts]
                properties:
                  profile_id: { type: string }
                  environment: { type: string }
                  status: { type: string }
                  config_ready: { type: boolean }
                  secrets_ready: { type: boolean }
                  offline_validated: { type: boolean }
                  external_verified: { type: boolean }
                  checklist_complete: { type: boolean }
                  alerts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, severity, message]
                      properties:
                        code: { type: string }
                        severity: { type: string, enum: [info, warning, blocking] }
                        message: { type: string }
                  rbac: { type: object, additionalProperties: true }
                  notes:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Lista eventos de auditoria admin (append-only, sem segredos)
      tags: [Ops]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ops/submissions:
    get:
      operationId: listOpsSubmissions
      summary: Fila ops de submissões (estados derivados; sem corpos secretos)
      description: >
        RM-BO-015. Reutiliza outbox/authority_attempts. Expõe queue_status, attempts,
        next_attempt_at, authority_request_id e sanitized_error (allowlist).
        Proibido payload, JWS, NIF ou segredos.
      tags: [Ops]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: queue_status
          in: query
          schema:
            type: string
            enum: [pending, processing, accepted, rejected, retry, manual_review, cancelled]
        - name: outbox_state
          in: query
          schema:
            type: string
            enum: [pending, in_flight, succeeded, dead]
      responses:
        "200":
          description: Resumos sanitizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ops/submissions/{submission_id}/actions:
    post:
      operationId: applyOpsSubmissionAction
      summary: Acção ops na fila (retry|cancel|manual_review)
      description: >
        RM-BO-016. Requer ops.write (owner|admin), header Idempotency-Key e
        expected_updated_at (concorrência). Simulator proibido em production.
        Sem payload/JWS/NIF/segredos. Auditoria append-only.
      tags: [Ops]
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsQueueActionRequest"
      responses:
        "200":
          description: Snapshot sanitizado pós-acção
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsQueueActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secret-refs/metadata:
    get:
      operationId: getSecretRefMetadata
      summary: Metadados sanitizados de uma ref (nunca o segredo)
      description: >
        Plano A — fingerprint/status/ambiente apenas. Sem plaintext. Put/Rotate/Revoke
        permanecem na zona SecAdm owner-only.
      tags: [Ops]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
        - name: environment
          in: query
          required: true
          schema:
            type: string
            enum: [homologation, production]
        - name: subject_id
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metadados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs:
    put:
      operationId: secadmPutSecretRef
      summary: Provisiona segredo (write-only; owner only)
      description: >
        Aceita plaintext no pedido; resposta contém apenas metadados sanitizados.
        Nunca devolve o segredo. Requer role owner + subject = FISCAL_ADMIN_OWNER_SUBJECT.
        ≠ credenciais AGT reais.
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmWriteSecretRequest"
      responses:
        "200":
          description: Metadados após put
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs/rotate:
    post:
      operationId: secadmRotateSecretRef
      summary: Roda segredo (write-only; owner only)
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmWriteSecretRequest"
      responses:
        "200":
          description: Metadados após rotate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/material:
    post:
      operationId: secadmPutMaterial
      summary: Importa material PEM/PKCS#12/credencial (multipart; owner)
      description: >
        Multipart: kind, environment, subject_id, name, encoding (pem|pkcs12|credential),
        material (ficheiro), password (só PKCS#12; efémera, nunca persistida/devolvida/auditada),
        expires_at opcional. Limites de tamanho fail-closed. Resposta só metadados + format_note.
        ≠ AGT real. UI: /admin/ui/secadm/material.
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, environment, subject_id, name, encoding, material]
              properties:
                kind:
                  type: string
                  enum: [producer_credential, producer_key, taxpayer_key, certificate]
                environment:
                  type: string
                  enum: [homologation, production]
                subject_id:
                  type: string
                name:
                  type: string
                encoding:
                  type: string
                  enum: [credential, pem, pkcs12]
                material:
                  type: string
                  format: binary
                password:
                  type: string
                  format: password
                  description: Efémera — nunca persistida
                expires_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Metadados após import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecAdmMaterialMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/material/rotate:
    post:
      operationId: secadmRotateMaterial
      summary: Rotaciona material PEM/PKCS#12/credencial (multipart; owner)
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, environment, subject_id, name, encoding, material]
              properties:
                kind:
                  type: string
                environment:
                  type: string
                  enum: [homologation, production]
                subject_id:
                  type: string
                name:
                  type: string
                encoding:
                  type: string
                  enum: [credential, pem, pkcs12]
                material:
                  type: string
                  format: binary
                password:
                  type: string
                  format: password
                expires_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Metadados após rotate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecAdmMaterialMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/material/validate-offline:
    post:
      operationId: secadmValidateOfflineMaterial
      summary: Validação offline par chave-certificado (owner)
      description: >
        Reveal efémero no runtime do store; resposta só relatório sanitizado (pair/chain/validity/purpose/fingerprint).
        Nunca devolve PEM. external_verified permanece false. Opcionalmente actualiza AuthorityProfile.offline_validated.
        ≠ AGT real.
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmOfflineValidateRequest"
      responses:
        "200":
          description: Relatório offline sanitizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecAdmOfflineValidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /secadm/secret-refs/revoke:
    post:
      operationId: secadmRevokeSecretRef
      summary: Revoga segredo (owner only; sem revelar valor)
      tags: [SecAdm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecAdmRevokeSecretRequest"
      responses:
        "200":
          description: Metadados após revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRefMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC/JWT de operador (RBAC: owner|admin|operator|auditor). Distinto do
        bearerAuth POS. Só owner acede SecAdm (e subject allowlist no runtime).
        Modos: fail_closed; injected (só development); oidc_jwt com JWKS https
        e mapa de grupos configurável (DEC-BO-003). Sessão browser ≠ este Bearer
        (RM-UI-005). Nunca enviar refresh tokens neste header.
  parameters:
    TaxpayerId:
      name: taxpayer_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EstablishmentId:
      name: establishment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    AdminHealth:
      type: object
      additionalProperties: false
      required: [status, component]
      properties:
        status:
          type: string
          enum: [ok]
        component:
          type: string
          enum: [admin]
        version:
          type: string
        revision:
          type: string
        request_id:
          type: string
    AdminReady:
      type: object
      additionalProperties: false
      required: [status, component, checks]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        component:
          type: string
          enum: [admin]
        version:
          type: string
        revision:
          type: string
        request_id:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
          description: >
            Apenas estados (ok/fail/configured/absent/auth mode name).
            Sem DSN, JWKS URL, tokens ou NIF.
    AdminMetrics:
      type: object
      additionalProperties: false
      properties:
        auth_mode:
          type: string
        auth_ok:
          type: integer
          minimum: 0
        auth_fail:
          type: integer
          minimum: 0
        series_dropped:
          type: integer
          minimum: 0
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              route_class:
                type: string
              method:
                type: string
              outcome:
                type: string
              count:
                type: integer
                minimum: 0
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    CreateTaxpayerRequest:
      type: object
      additionalProperties: false
      required: [nif, legal_name]
      properties:
        nif:
          type: string
          minLength: 1
        legal_name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, inactive]
          default: active
        fe_enrollment:
          $ref: "#/components/schemas/UpsertFEEnrollmentRequest"
    UpsertFEEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [environment, status]
      properties:
        environment:
          type: string
          enum: [homologation, production, development]
        status:
          type: string
          enum: [not_enrolled, pending, active, suspended]
          description: >
            DEC-PROD-004. active ≡ aderiu facturação electrónica nesse ambiente;
            ausente na BD trata-se como not_enrolled.
    FEEnrollment:
      type: object
      additionalProperties: false
      required: [environment, status, updated_at]
      properties:
        environment:
          type: string
          enum: [homologation, production, development]
        status:
          type: string
          enum: [not_enrolled, pending, active, suspended]
        updated_at:
          type: string
          format: date-time
    Taxpayer:
      type: object
      additionalProperties: false
      required: [taxpayer_id, nif, legal_name, status, created_at, fe_enrollments]
      properties:
        taxpayer_id:
          type: string
        nif:
          type: string
          description: Visível só a operadores autorizados; proibido em logs/métricas/audit resource_id.
        legal_name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        fe_enrollments:
          type: array
          items:
            $ref: "#/components/schemas/FEEnrollment"
          description: Linhas persistidas; ambiente ausente ⇒ efectivo not_enrolled.
    TaxpayerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Taxpayer"
    CreateEstablishmentRequest:
      type: object
      additionalProperties: false
      required: [taxpayer_id, code, name]
      properties:
        taxpayer_id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
          default: active
    Establishment:
      type: object
      additionalProperties: false
      required: [establishment_id, taxpayer_id, code, name, status, created_at]
      properties:
        establishment_id:
          type: string
        taxpayer_id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
    EstablishmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Establishment"
    UpsertDocumentGroupRequest:
      type: object
      additionalProperties: false
      required: [environment, grupo, active]
      properties:
        environment:
          type: string
          enum: [homologation, production, development]
        grupo:
          type: string
          enum: [vendas, movimentacao, conferencia, pagamentos, compras]
        active:
          type: boolean
    UpsertDocumentTypeRequest:
      type: object
      additionalProperties: false
      required: [environment, codigo_canonico, active]
      properties:
        environment:
          type: string
          enum: [homologation, production, development]
        codigo_canonico:
          type: string
          description: Must exist in catalog seed (bwb.ao.*); never invent FE-RNG codes.
        active:
          type: boolean
    DocumentAvailabilityReport:
      type: object
      additionalProperties: false
      required:
        - establishment_id
        - taxpayer_id
        - environment
        - fe_enrollment_status
        - fe_aderiu
        - groups
        - types
        - computed_at
      properties:
        establishment_id:
          type: string
        taxpayer_id:
          type: string
        environment:
          type: string
        fe_enrollment_status:
          type: string
          enum: [not_enrolled, pending, active, suspended]
        fe_aderiu:
          type: boolean
          description: Derived (status==active); not a stored boolean model (DEC-PROD-004).
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [grupo, active]
            properties:
              grupo:
                type: string
              active:
                type: boolean
        types:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTypeAvailability"
        computed_at:
          type: string
          format: date-time
    DocumentTypeAvailability:
      type: object
      additionalProperties: false
      required:
        - grupo
        - codigo_canonico
        - designacao
        - available
        - reasons
        - eligibility
        - estado_normativo
        - seed_activo
        - effective_activo
        - group_active
      properties:
        grupo:
          type: string
        codigo_canonico:
          type: string
        designacao:
          type: string
        available:
          type: boolean
        reasons:
          type: array
          items:
            type: string
            enum:
              - group_inactive
              - type_inactive
              - agt_pending
              - saft_incompatible
              - fe_matrix_unsupported
              - unknown_canonical
        eligibility:
          type: string
        fe_code:
          type: string
        saft_type:
          type: string
        estado_normativo:
          type: string
        seed_activo:
          type: string
        effective_activo:
          type: boolean
        group_active:
          type: boolean
    CreateScopeBindingRequest:
      type: object
      additionalProperties: false
      required:
        - scope_id
        - taxpayer_id
        - establishment_id
        - environment
        - iana_timezone
        - series_effective_code
      properties:
        scope_id:
          type: string
        taxpayer_id:
          type: string
        establishment_id:
          type: string
        environment:
          type: string
          enum: [homologation, production, development]
        iana_timezone:
          type: string
          example: Africa/Luanda
        series_effective_code:
          type: string
        status:
          type: string
          enum: [active, inactive]
          default: active
    CreateSeriesRequest:
      type: object
      additionalProperties: false
      required: [environment, codigo_canonico, code]
      properties:
        environment:
          type: string
