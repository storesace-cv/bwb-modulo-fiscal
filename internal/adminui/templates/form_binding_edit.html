{{define "content"}}
{{if .Error}}<p class="flash error" role="alert">{{.Error}}</p>{{end}}
{{with .Binding}}
<form method="post" action="/admin/ui/bindings/{{.ScopeID}}">
  <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
  <p>Scope: <code>{{.ScopeID}}</code> (contribuinte/estabelecimento imutáveis)</p>
  <p>
    <label for="environment">Ambiente</label>
    <select id="environment" name="environment" required>
      <option value="homologation"{{if eq .Environment "homologation"}} selected{{end}}>homologation</option>
      <option value="production"{{if eq .Environment "production"}} selected{{end}}>production</option>
      <option value="development"{{if eq .Environment "development"}} selected{{end}}>development</option>
    </select>
  </p>
  <p>
    <label for="iana_timezone">Timezone IANA</label>
    <input id="iana_timezone" name="iana_timezone" value="{{.IANATimezone}}" required>
  </p>
  <p>
    <label for="series_effective_code">Série efectiva</label>
    <input id="series_effective_code" name="series_effective_code" value="{{.SeriesEffectiveCode}}" required>
  </p>
  <p>
    <label for="status">Estado</label>
    <select id="status" name="status">
      <option value="active"{{if eq .Status "active"}} selected{{end}}>active</option>
      <option value="inactive"{{if eq .Status "inactive"}} selected{{end}}>inactive</option>
    </select>
  </p>
  <p><button type="submit">Guardar</button> <a href="/admin/ui/bindings">Cancelar</a></p>
</form>
{{end}}
{{end}}
