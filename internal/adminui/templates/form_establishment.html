{{define "content"}}
{{if .Error}}<p class="flash error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/admin/ui/establishments">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <p>
    <label for="taxpayer_id">Contribuinte</label>
    <select id="taxpayer_id" name="taxpayer_id" required>
      {{range .Taxpayers}}
      <option value="{{.ID}}">{{.NIF}} — {{.LegalName}}</option>
      {{end}}
    </select>
  </p>
  <p>
    <label for="code">Código</label>
    <input id="code" name="code" required>
  </p>
  <p>
    <label for="name">Nome</label>
    <input id="name" name="name" required>
  </p>
  <p>
    <label for="status">Estado</label>
    <select id="status" name="status">
      <option value="active">active</option>
      <option value="inactive">inactive</option>
    </select>
  </p>
  <p><button type="submit">Criar</button> <a href="/admin/ui/establishments">Cancelar</a></p>
</form>
{{end}}
