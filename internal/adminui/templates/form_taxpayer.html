{{define "content"}}
{{if .Error}}<p class="flash error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/admin/ui/taxpayers">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <p>
    <label for="nif">NIF</label>
    <input id="nif" name="nif" required autocomplete="off">
  </p>
  <p>
    <label for="legal_name">Nome legal</label>
    <input id="legal_name" name="legal_name" required autocomplete="organization">
  </p>
  <p>
    <label for="status">Estado</label>
    <select id="status" name="status">
      <option value="active">active</option>
      <option value="inactive">inactive</option>
    </select>
  </p>
  <fieldset>
    <legend>Adesão FE (DEC-PROD-004; opcional)</legend>
    <p>
      <label for="fe_environment">Ambiente</label>
      <select id="fe_environment" name="fe_environment">
        <option value="">—</option>
        <option value="homologation">homologation</option>
        <option value="production">production</option>
        <option value="development">development</option>
      </select>
    </p>
    <p>
      <label for="fe_enrollment_status">Estado FE</label>
      <select id="fe_enrollment_status" name="fe_enrollment_status">
        <option value="not_enrolled">not_enrolled</option>
        <option value="pending">pending</option>
        <option value="active">active (aderiu)</option>
        <option value="suspended">suspended</option>
      </select>
    </p>
    <p class="hint">Enum canónico — nunca booleano. active ≡ aderiu facturação electrónica nesse ambiente.</p>
  </fieldset>
  <p><button type="submit">Criar</button> <a href="/admin/ui/taxpayers">Cancelar</a></p>
</form>
{{end}}
